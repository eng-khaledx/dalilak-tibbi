<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة الإدارة | دليلك الطبي بكفرالشيخ</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#071F49">
  <link rel="icon" href="../brand/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="no-floating admin-body">

  <!-- Login gate -->
  <section class="admin-login" id="admin-login">
    <div class="card card--pad admin-login__card">
      <img src="../brand/logo.png" alt="دليلك الطبي بكفرالشيخ" class="admin-login__logo" onerror="this.style.display='none'">
      <h1 class="section-title" style="font-size:var(--text-xl)">لوحة الإدارة</h1>
      <p class="text-muted mb-4" style="font-size:var(--text-sm)">دليلك الطبي بكفرالشيخ</p>
      <form id="login-form" novalidate>
        <div class="field">
          <label class="field__label" for="admin-pass">كلمة المرور</label>
          <input class="input ltr" id="admin-pass" type="password" autocomplete="current-password" required>
          <span class="field__error" id="login-error"></span>
        </div>
        <button type="submit" class="btn btn--primary btn--block mt-4">دخول</button>
      </form>
      <a class="btn btn--ghost btn--sm btn--block mt-2" href="../index.html"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i> العودة للموقع</a>
    </div>
  </section>

  <!-- App -->
  <div class="admin" id="admin-app" hidden>
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="admin-sidebar__brand">
        <img src="../brand/logo.png" alt="دليلك الطبي بكفرالشيخ" width="36" height="36" onerror="this.style.display='none'">
        <div><strong>دليلك الطبي</strong><small>لوحة الإدارة</small></div>
      </div>
      <nav class="admin-nav" aria-label="أقسام الإدارة">
        <a href="#leads" data-view="leads" class="is-active"><i class="fa-solid fa-inbox"></i> الطلبات <span class="badge badge--gold" id="nav-new-count" hidden></span></a>
        <a href="#providers" data-view="providers"><i class="fa-solid fa-user-doctor"></i> مقدمو الخدمة</a>
        <a href="#offers" data-view="offers"><i class="fa-solid fa-tag"></i> العروض</a>
        <a href="#specialties" data-view="specialties"><i class="fa-solid fa-stethoscope"></i> التخصصات</a>
        <a href="#services" data-view="services"><i class="fa-solid fa-briefcase-medical"></i> الخدمات</a>
        <a href="#areas" data-view="areas"><i class="fa-solid fa-map-location-dot"></i> المناطق</a>
        <a href="#audit" data-view="audit"><i class="fa-solid fa-clock-rotate-left"></i> سجل النشاط</a>
      </nav>
      <div class="admin-sidebar__footer">
        <a class="btn btn--ghost btn--sm btn--block" href="../index.html" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> عرض الموقع</a>
        <button type="button" class="btn btn--outline btn--sm btn--block" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <button type="button" class="btn btn--soft btn--icon admin-menu-btn" id="admin-menu-btn" aria-label="القائمة"><i class="fa-solid fa-bars"></i></button>
        <h1 class="admin-topbar__title" id="view-title">الطلبات</h1>
        <div class="flex gap-2">
          <button type="button" class="btn btn--outline btn--sm" id="refresh-btn"><i class="fa-solid fa-rotate"></i> تحديث</button>
        </div>
      </header>
      <section class="admin-content" id="admin-content" aria-live="polite"></section>
    </div>
    <div class="admin-sidebar-backdrop" id="admin-sidebar-backdrop"></div>
  </div>

  <!-- Generic edit modal -->
  <div class="modal" id="edit-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__dialog" style="max-width:720px">
      <div class="modal__header">
        <h2 class="modal__title" id="edit-modal-title">تعديل</h2>
        <button type="button" class="modal__close" data-close aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal__body" id="edit-modal-body"></div>
    </div>
  </div>

  <script type="module" src="../js/admin/app.js"></script>
</body>
</html>
