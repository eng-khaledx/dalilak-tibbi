<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" role="img" aria-labelledby="hv-title">
  <title id="hv-title">رسم توضيحي: خدمات طبية في كفرالشيخ</title>
  <defs>
    <linearGradient id="g-soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF5FC"/>
      <stop offset="1" stop-color="#DCEFF9"/>
    </linearGradient>
    <linearGradient id="g-navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17407F"/>
      <stop offset="1" stop-color="#071F49"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#071F49" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- soft background blobs -->
  <ellipse cx="300" cy="250" rx="230" ry="200" fill="url(#g-soft)"/>
  <circle cx="470" cy="110" r="70" fill="#BFE3F5" opacity="0.55"/>
  <circle cx="90" cy="380" r="48" fill="#FBF3DF"/>

  <!-- dotted grid hint -->
  <g fill="#BFE3F5">
    <circle cx="60" cy="80" r="2.5"/><circle cx="80" cy="80" r="2.5"/><circle cx="100" cy="80" r="2.5"/><circle cx="120" cy="80" r="2.5"/>
    <circle cx="60" cy="100" r="2.5"/><circle cx="80" cy="100" r="2.5"/><circle cx="100" cy="100" r="2.5"/><circle cx="120" cy="100" r="2.5"/>
    <circle cx="60" cy="120" r="2.5"/><circle cx="80" cy="120" r="2.5"/><circle cx="100" cy="120" r="2.5"/><circle cx="120" cy="120" r="2.5"/>
  </g>

  <!-- ECG line -->
  <path d="M40 260 H150 l16 -34 l20 68 l20 -96 l22 120 l18 -58 H300" fill="none" stroke="#234F97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M300 260 H520" fill="none" stroke="#234F97" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 10" opacity="0.45"/>

  <!-- main card: search result style -->
  <g filter="url(#shadow)">
    <rect x="150" y="120" width="300" height="118" rx="18" fill="#FFFFFF"/>
    <rect x="382" y="140" width="48" height="48" rx="12" fill="#EAF5FC"/>
    <!-- stethoscope glyph -->
    <path d="M396 150 v10 a10 10 0 0 0 20 0 v-10" fill="none" stroke="#17407F" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="416" cy="178" r="4" fill="none" stroke="#17407F" stroke-width="2.5"/>
    <path d="M406 170 c0 6 3 8 10 8" fill="none" stroke="#17407F" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="250" y="146" width="116" height="12" rx="6" fill="#0E2D63"/>
    <rect x="290" y="168" width="76" height="9" rx="4.5" fill="#BFE3F5"/>
    <rect x="240" y="168" width="40" height="9" rx="4.5" fill="#DCEFF9"/>
    <rect x="170" y="200" width="84" height="22" rx="11" fill="#071F49"/>
    <rect x="264" y="200" width="66" height="22" rx="11" fill="#E6F6EE"/>
    <circle cx="350" cy="211" r="3" fill="#D9A72E"/><circle cx="362" cy="211" r="3" fill="#D9A72E"/><circle cx="374" cy="211" r="3" fill="#D9A72E"/>
  </g>

  <!-- secondary card: map pin / location -->
  <g filter="url(#shadow)">
    <rect x="70" y="300" width="230" height="86" rx="16" fill="#FFFFFF"/>
    <rect x="234" y="318" width="44" height="44" rx="12" fill="#FBF3DF"/>
    <path d="M256 326 c-7 0-12 5-12 12 0 9 12 20 12 20 s12-11 12-20 c0-7-5-12-12-12z" fill="#D9A72E"/>
    <circle cx="256" cy="338" r="4" fill="#FFFFFF"/>
    <rect x="130" y="322" width="90" height="10" rx="5" fill="#0E2D63"/>
    <rect x="96" y="342" width="124" height="8" rx="4" fill="#DCEFF9"/>
    <rect x="160" y="358" width="60" height="8" rx="4" fill="#BFE3F5"/>
  </g>

  <!-- third card: lab / plus -->
  <g filter="url(#shadow)">
    <rect x="340" y="290" width="160" height="120" rx="16" fill="#FFFFFF"/>
    <circle cx="420" cy="334" r="26" fill="url(#g-navy)"/>
    <path d="M420 322 v24 M408 334 h24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <rect x="378" y="372" width="84" height="9" rx="4.5" fill="#DCEFF9"/>
    <rect x="394" y="388" width="52" height="8" rx="4" fill="#BFE3F5"/>
  </g>

  <!-- small floating pill -->
  <g filter="url(#shadow)">
    <rect x="410" y="60" width="96" height="34" rx="17" fill="#FFFFFF"/>
    <circle cx="430" cy="77" r="7" fill="#25D366"/>
    <rect x="446" y="72" width="46" height="10" rx="5" fill="#DCEFF9"/>
  </g>

  <!-- gold accent line -->
  <path d="M60 440 Q 280 400 500 440" fill="none" stroke="#D9A72E" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
